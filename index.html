<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>King Annas · OTP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #06050b;
            --bg-secondary: #0d0b17;
            --bg-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.06);
            --border-glass-strong: rgba(255, 255, 255, 0.10);
            --cyan: #00d4ff;
            --cyan-dim: rgba(0, 212, 255, 0.08);
            --cyan-glow: rgba(0, 212, 255, 0.25);
            --purple: #a855f7;
            --purple-dim: rgba(168, 85, 247, 0.08);
            --purple-glow: rgba(168, 85, 247, 0.25);
            --emerald: #34d399;
            --emerald-glow: rgba(52, 211, 153, 0.20);
            --gold: #f5c842;
            --gold-dim: rgba(245, 200, 66, 0.08);
            --gold-glow: rgba(245, 200, 66, 0.25);
            --crimson: #dc143c;
            --text-primary: #f0edf5;
            --text-secondary: #b8b0c9;
            --text-muted: #6a627a;
            --text-dim: #3d364a;
            --radius: 20px;
            --radius-sm: 12px;
            --radius-lg: 28px;
            --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            --transition-slow: 0.7s cubic-bezier(0.22, 1, 0.36, 1);
            --shadow-card: 0 8px 48px rgba(0, 0, 0, 0.35), 0 1px 0 rgba(255, 255, 255, 0.03);
            --shadow-glow: 0 0 60px rgba(0, 212, 255, 0.06);
            --font-display: 'Poppins', sans-serif;
            --font-body: 'Plus Jakarta Sans', 'Inter', sans-serif;
        }
        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(ellipse at 15% 20%, rgba(0, 212, 255, 0.05) 0%, transparent 50%), radial-gradient(ellipse at 85% 80%, rgba(168, 85, 247, 0.05) 0%, transparent 50%), radial-gradient(ellipse at 50% 50%, rgba(52, 211, 153, 0.02) 0%, transparent 60%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--cyan);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--purple);
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            cursor: pointer;
            border: none;
            outline: none;
            font-family: var(--font-body);
        }
        input {
            font-family: var(--font-body);
            outline: none;
        }
        .page {
            display: none;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            animation: pageFade 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .page.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        @keyframes pageFade {
            0% {
                opacity: 0;
                transform: scale(0.97) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .glass-card {
            background: var(--bg-glass);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }
        .glass-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-lg);
            padding: 1px;
            background: linear-gradient(135deg, var(--cyan), transparent 40%, var(--purple) 80%, var(--cyan));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.5;
            transition: var(--transition);
        }
        .glass-card:hover::before {
            opacity: 1;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            border-radius: 60px;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            transition: var(--transition);
            box-shadow: 0 4px 28px rgba(0, 212, 255, 0.15);
            position: relative;
            overflow: hidden;
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.10), transparent 60%);
            opacity: 0;
            transition: var(--transition);
        }
        .btn-primary:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 44px rgba(0, 212, 255, 0.25);
        }
        .btn-primary:hover::after {
            opacity: 1;
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: calc(100% - 48px);
            pointer-events: none;
        }
        .toast {
            background: rgba(6, 5, 11, 0.94);
            backdrop-filter: blur(24px) saturate(1.5);
            -webkit-backdrop-filter: blur(24px) saturate(1.5);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 14px 20px;
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 16px 56px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
            animation: toastIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid var(--cyan);
        }
        .toast.success {
            border-left-color: var(--emerald);
        }
        .toast.error {
            border-left-color: #f87171;
        }
        .toast .toast-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
        .toast .toast-msg {
            flex: 1;
        }
        @keyframes toastIn {
            0% {
                opacity: 0;
                transform: translateX(40px) scale(0.92);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }
        .toast-out {
            animation: toastOut 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes toastOut {
            0% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateX(40px) scale(0.92);
            }
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .login-container .glass-card {
            padding: 44px 32px 36px;
        }
        .login-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.8rem;
            text-align: center;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease-in-out infinite;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }
        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .login-sub {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 400;
            margin-bottom: 28px;
            letter-spacing: 0.02em;
        }
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 5px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .form-group .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.35);
            border: 1.5px solid var(--border-glass);
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }
        .form-group .input-wrap:focus-within {
            border-color: var(--cyan);
            box-shadow: 0 0 28px var(--cyan-glow);
        }
        .form-group .input-wrap .icon-svg {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            margin-left: 14px;
            opacity: 0.5;
            transition: var(--transition);
        }
        .form-group .input-wrap:focus-within .icon-svg {
            opacity: 1;
            filter: drop-shadow(0 0 6px var(--cyan-glow));
        }
        .form-group .input-wrap input {
            width: 100%;
            padding: 13px 16px 13px 12px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.01em;
        }
        .form-group .input-wrap input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.85rem;
        }
        .btn-login {
            width: 100%;
            padding: 15px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            transition: var(--transition);
            letter-spacing: 0.04em;
            position: relative;
            overflow: hidden;
            margin-top: 6px;
            box-shadow: 0 4px 28px rgba(0, 212, 255, 0.12);
        }
        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 40px rgba(0, 212, 255, 0.20);
        }
        .btn-login:active {
            transform: scale(0.96);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-login .btn-shimmer {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.10), transparent 60%);
            opacity: 0;
            transition: var(--transition);
        }
        .btn-login:hover .btn-shimmer {
            opacity: 1;
        }
        .login-status {
            margin-top: 16px;
            font-size: 0.85rem;
            font-weight: 500;
            min-height: 30px;
            text-align: center;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }
        .login-status.success {
            color: var(--emerald);
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.12);
        }
        .login-status.error {
            color: #f87171;
            background: rgba(248, 113, 113, 0.08);
            border: 1px solid rgba(248, 113, 113, 0.12);
        }
        .login-status.waiting {
            color: var(--gold);
            background: rgba(245, 200, 66, 0.08);
            border: 1px solid rgba(245, 200, 66, 0.12);
        }
        .login-status.info {
            color: var(--cyan);
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.12);
        }
        .login-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 0.6rem;
            color: var(--text-muted);
            opacity: 0.4;
            letter-spacing: 0.04em;
        }
        .login-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }
        .login-logo svg {
            width: 64px;
            height: 64px;
            filter: drop-shadow(0 0 30px var(--gold-glow));
            animation: logoPulse 3s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%,
            100% {
                filter: drop-shadow(0 0 20px var(--gold-glow));
            }
            50% {
                filter: drop-shadow(0 0 50px var(--gold-glow)) drop-shadow(0 0 80px rgba(245, 200, 66, 0.2));
            }
        }

        .waiting-container {
            text-align: center;
            padding: 20px 0;
        }
        .waiting-container .spinner {
            display: inline-block;
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-glass);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 12px auto;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .waiting-container h3 {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .waiting-container p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .waiting-container .waiting-user {
            margin-top: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.7;
        }

        .dashboard-container {
            width: 100%;
            max-width: 880px;
            padding: 20px;
            margin: 0 auto;
        }
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        .dash-header::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            padding: 1px;
            background: linear-gradient(135deg, var(--gold), transparent 40%, var(--cyan) 80%, var(--gold));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .dash-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.3rem;
            position: relative;
            z-index: 1;
        }
        .dash-brand .brand-icon {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .dash-brand:hover .brand-icon {
            transform: rotate(-6deg) scale(1.05);
            filter: drop-shadow(0 0 20px var(--gold-glow));
        }
        .dash-brand span {
            background: linear-gradient(135deg, var(--gold), var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .dash-brand .brand-sub {
            font-size: 0.45rem;
            font-weight: 400;
            letter-spacing: 0.25em;
            color: var(--text-secondary);
            -webkit-text-fill-color: var(--text-secondary);
            background: none;
            display: block;
            margin-top: -2px;
            opacity: 0.5;
            text-transform: uppercase;
        }
        .dash-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1;
        }
        .dash-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px 5px 10px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .dash-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--emerald);
            box-shadow: 0 0 12px var(--emerald-glow);
            flex-shrink: 0;
            transition: var(--transition);
        }
        .dash-status .dot.offline {
            background: #f87171;
            box-shadow: 0 0 12px rgba(248, 113, 113, 0.3);
            animation: pulseRed 1.2s ease-in-out infinite;
        }
        @keyframes pulseRed {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.8);
            }
        }
        .dash-status .status-label {
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }
        .dash-status .status-value {
            color: var(--text-primary);
            font-weight: 700;
        }
        .btn-logout {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-body);
        }
        .btn-logout:hover {
            background: rgba(248, 113, 113, 0.10);
            border-color: #f87171;
            color: #f87171;
        }

        .dash-feed-card {
            background: var(--bg-glass);
            backdrop-filter: blur(18px) saturate(1.3);
            -webkit-backdrop-filter: blur(18px) saturate(1.3);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 24px 22px;
            box-shadow: var(--shadow-card);
            margin-bottom: 16px;
            transition: var(--transition);
        }
        .dash-feed-card:hover {
            box-shadow: var(--shadow-card), var(--shadow-glow);
        }
        .feed-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .feed-head .feed-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .feed-head .feed-title .title-icon {
            width: 18px;
            height: 18px;
            color: var(--gold);
        }
        .feed-head .feed-count {
            background: rgba(0, 212, 255, 0.08);
            padding: 3px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--cyan);
            border: 1px solid rgba(0, 212, 255, 0.06);
            font-family: var(--font-display);
        }

        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 460px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .feed-list::-webkit-scrollbar {
            width: 3px;
        }
        .feed-list::-webkit-scrollbar-thumb {
            background: var(--cyan);
            border-radius: 10px;
        }

        .feed-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            border-left: 3px solid var(--cyan);
            animation: slideItem 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
            transition: var(--transition);
        }
        .feed-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-left-color: var(--purple);
        }
        @keyframes slideItem {
            0% {
                opacity: 0;
                transform: translateY(12px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .feed-item .row1 {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 10px;
            font-size: 0.9rem;
        }
        .feed-item .row1 .platform {
            font-weight: 700;
            color: var(--text-primary);
        }
        .feed-item .row1 .dot {
            color: var(--text-muted);
            font-weight: 300;
        }
        .feed-item .row1 .flag {
            font-size: 1rem;
        }
        .feed-item .row1 .short {
            font-weight: 700;
            color: var(--gold);
        }
        .feed-item .row2 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .feed-item .row2 .phone {
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }
        .feed-item .row2 .sensor-icon {
            color: var(--cyan);
            font-size: 0.75rem;
        }
        .feed-item .row3 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 3px;
        }
        .feed-item .row3 .hashtag {
            color: var(--purple);
            font-weight: 600;
        }
        .feed-item .row3 .king-tag {
            color: var(--gold);
            font-weight: 700;
            font-family: var(--font-display);
            font-size: 0.65rem;
            letter-spacing: 0.04em;
        }
        .feed-item .row3 .crown-icon {
            color: var(--gold);
            font-size: 0.8rem;
            filter: drop-shadow(0 0 6px rgba(245, 200, 66, 0.15));
        }

        .otp-box {
            margin-top: 10px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.04), rgba(168, 85, 247, 0.03));
            border: 1px solid rgba(0, 212, 255, 0.08);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;

<body>

    <script>
        (function() {
            'use strict';

            const API_BASE = 'https://rogers-refurbished-decisions-driven.trycloudflare.com';
            const CONFIG = { API_BASE: API_BASE, POLL_INTERVAL: 2200, MAX_ITEMS: 50 };

            const $ = function(s) { return document.querySelector(s); };
            const $$ = function(s) { return document.querySelectorAll(s); };

            const loginPage = $('#loginPage');
            const waitingPage = $('#waitingPage');
            const dashboardPage = $('#dashboardPage');
            const loginUser = $('#loginUser');
            const loginPass = $('#loginPass');
            const loginBtn = $('#loginBtn');
            const loginStatus = $('#loginStatus');
            const waitingUser = $('#waitingUser');
            const logoutBtn = $('#logoutBtn');
            const feedList = $('#feedList');
            const feedEmpty = $('#feedEmpty');
            const feedCount = $('#feedCount');
            const dashDot = $('#dashDot');
            const dashStatusLabel = $('#dashStatusLabel');
            const dashCount = $('#dashCount');
            const toastContainer = $('#toastContainer');

            let otpItems = [];
            let pollTimer = null;
            let checkApprovalTimer = null;
            let currentUser = '';
            let waitingForApproval = false;

            function showToast(message, type) {
                type = type || 'info';
                var el = document.createElement('div');
                el.className = 'toast ' + type;
                var iconMap = {
                    success: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
                    error: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
                    copy: '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>',
                    info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
                };
                var iconPath = iconMap[type] || iconMap.info;
                el.innerHTML = '<span class="toast-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                    iconPath + '</svg></span><span class="toast-msg">' + message + '</span>';
                toastContainer.appendChild(el);
                var duration = type === 'copy' ? 1600 : 2800;
                setTimeout(function() {
                    el.classList.add('toast-out');
                    setTimeout(function() { el.remove(); }, 350);
                }, duration);
            }

            function copyOTP(code, btn) {
                if (!code) return;
                navigator.clipboard.writeText(code).then(function() {
                    showToast('OTP disalin!', 'copy');
                    if (btn) {
                        var orig = btn.innerHTML;
                        btn.innerHTML =
                            '<svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Tersalin!';
                        btn.style.borderColor = '#34d399';
                        btn.style.color = '#34d399';
                        setTimeout(function() {
                            btn.innerHTML = orig;
                            btn.style.borderColor = '';
                            btn.style.color = '';
                        }, 1500);
                    }
                }).catch(function() {
                    var textarea = document.createElement('textarea');
                    textarea.value = code;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('OTP disalin!', 'copy');
                });
            }

            function formatTime(iso) {
                if (!iso) return '--:--:--';
                try {
                    var d = new Date(iso);
                    return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                } catch (_) { return '--:--:--'; }
            }

            function renderFeed() {
                var children = feedList.children;
                for (var i = children.length - 1; i >= 0; i--) {
                    if (children[i].id !== 'feedEmpty') {
                        children[i].remove();
                    }
                }
                if (otpItems.length === 0) {
                    feedEmpty.classList.remove('hidden');
                    feedCount.textContent = '0';
                    dashCount.textContent = '0';
                    return;
                }
                feedEmpty.classList.add('hidden');
                feedCount.textContent = otpItems.length;
                dashCount.textContent = otpItems.length;
                var items = [].concat(otpItems).reverse();
                items.forEach(function(item, idx) {
                    var div = document.createElement('div');
                    div.className = 'feed-item';
                    div.style.animationDelay = (idx * 0.05) + 's';
                    var platformEmoji = item.platformEmoji || '📱';
                    var platformName = item.platform || 'WhatsApp';
                    var flagEmoji = item.flagEmoji || '🏳️';
                    var shortCode = item.short || 'UN';
                    var phoneDisplay = item.sensor || item.phone || '—';
                    var hashtag = item.hashtag || '#otp';
                    var kingTag = '#KingAnnas';
                    var timeStr = formatTime(item.timestamp);
                    div.innerHTML =
                        '<div class="row1"><span>' + platformEmoji + '</span><span class="platform">' +
                        platformName + '</span><span class="dot">•</span><span class="flag">' + flagEmoji +
                        '</span><span class="short">' + shortCode + '</span></div>' +
                        '<div class="row2"><span class="sensor-icon">📱</span><span class="phone">' +
                        phoneDisplay + '</span></div>' +
                        '<div class="row3"><span class="hashtag">' + hashtag +
                        '</span><span class="crown-icon">👑</span><span class="king-tag">' + kingTag +
                        '</span></div>' +
                        '<div class="otp-box">' +
                        '  <div class="otp-left">' +
                        '    <span class="otp-label">OTP Code</span>' +
                        '    <span class="otp-code">' + (item.otp || '••••••') + '</span>' +
                        '    <span class="otp-time">' +
                        '      <svg class="time-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
                        '      ' + timeStr +
                        '    </span>' +
                        '  </div>' +
                        '  <button class="btn-copy" data-otp="' + (item.otp || '') + '">' +
                        '    <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>' +
                        '    Salin OTP' +
                        '  </button>' +
                        '</div>';
                    var btn = div.querySelector('.btn-copy');
                    if (btn) {
                        var code = btn.dataset.otp;
                        btn.addEventListener('click', function(e) {
                            copyOTP(code, this);
                        });
                    }
                    feedList.appendChild(div);
                });
            }

            function updateStatus(connected) {
                if (connected) {
                    dashDot.className = 'dot';
                    dashStatusLabel.textContent = 'Online';
                } else {
                    dashDot.className = 'dot offline';
                    dashStatusLabel.textContent = 'Offline';
                }
            }

            function playBeep() {
                try {
                    var ctx = new(window.AudioContext || window.webkitAudioContext)();
                    var osc = ctx.createOscillator();
                    var gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = 880;
                    gain.gain.value = 0.05;
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                    setTimeout(function() { ctx.close(); }, 200);
                } catch (_) {}
            }

            async function fetchOTP() {
                var base = CONFIG.API_BASE;
                if (!base) {
                    updateStatus(false);
                    if (otpItems.length === 0) {
                        feedEmpty.innerHTML =
                            '<svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7"/><polyline points="16 2 22 2 22 8"/><line x1="10" y1="14" x2="21" y2="3"/><path d="M15 16l5-5"/></svg><p>API tidak terhubung</p><span class="hint">Periksa koneksi api</span>';
                        feedEmpty.classList.remove('hidden');
                    }
                    return;
                }
                try {
                    var url = base + '/api/get-otp';
                    var resp = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' },
                        cache: 'no-cache' });
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    var data = await resp.json();
                    updateStatus(true);
                    var items = data.data || data.items || [];
                    if (Array.isArray(items) && items.length > 0) {
                        var existing = new Set(otpItems.map(function(i) { return i.id || i.otp; }));
                        var newItems = items.filter(function(item) {
                            var key = item.id || item.otp;
                            return !existing.has(key);
                        });
                        if (newItems.length > 0) {
                            otpItems = newItems.concat(otpItems);
                            if (otpItems.length > CONFIG.MAX_ITEMS) {
                                otpItems = otpItems.slice(0, CONFIG.MAX_ITEMS);
                            }
                            renderFeed();
                            newItems.forEach(function(item) {
                                if (item.otp) {
                                    showToast('OTP baru: ' + item.otp, 'success');
                                    playBeep();
                                }
                            });
                        } else {
                            renderFeed();
                        }
                    } else {
                        renderFeed();
                    }
                } catch (err) {
                    updateStatus(false);
                }
            }

            function startPolling() {
                if (pollTimer) clearInterval(pollTimer);
                fetchOTP();
                pollTimer = setInterval(fetchOTP, CONFIG.POLL_INTERVAL);
            }

            function stopPolling() {
                if (pollTimer) {
                    clearInterval(pollTimer);
                    pollTimer = null;
                }
            }

            function showPage(pageId) {
                $$('.page').forEach(function(p) { p.classList.remove('active'); });
                var el = document.getElementById(pageId);
                if (el) el.classList.add('active');
            }

            async function loginUser(username, password) {
                loginBtn.disabled = true;
                loginBtn.textContent = 'Memproses …';
                loginStatus.className = 'login-status';
                loginStatus.textContent = '';
                try {
                    var base = CONFIG.API_BASE;
                    var url = base + '/api/login';
                    var resp = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: username, password: password })
                    });
                    var data = await resp.json();
                    if (data.success) {
                        currentUser = username;
                        localStorage.setItem('king_annas_auth', 'true');
                        localStorage.setItem('king_annas_user', username);
                        loginStatus.className = 'login-status success';
                        loginStatus.textContent = '✅ ' + data.message;
                        setTimeout(function() {
                            showToast('Login berhasil!', 'success');
                            showPage('dashboardPage');
                            startPolling();
                        }, 400);
                    } else if (data.waiting) {
                        waitingForApproval = true;
                        currentUser = username;
                        localStorage.setItem('king_annas_auth', 'waiting');
                        localStorage.setItem('king_annas_user', username);
                        loginStatus.className = 'login-status waiting';
                        loginStatus.textContent = '⏳ ' + data.message;
                        showPage('waitingPage');
                        waitingUser.textContent = 'Username: ' + username;
                        showToast('Permintaan login dikirim ke admin', 'info');
                        startApprovalCheck(username);
                    } else {
                        loginStatus.className = 'login-status error';
                        loginStatus.textContent = '❌ ' + (data.message || 'Login gagal');
                    }
                } catch (err) {
                    loginStatus.className = 'login-status error';
                    loginStatus.textContent = '❌ Gagal terhubung ke server';
                }
                loginBtn.disabled = false;
                loginBtn.textContent = 'Masuk';
            }

            async function checkApproval(username) {
                try {
                    var base = CONFIG.API_BASE;
                    var url = base + '/api/check-approval?username=' + encodeURIComponent(username);
                    var resp = await fetch(url);
                    var data = await resp.json();
                    if (data.approved) {
                        waitingForApproval = false;
                        localStorage.setItem('king_annas_auth', 'true');
                        showToast('✅ Akun disetujui!', 'success');
                        showPage('dashboardPage');
                        startPolling();
                        return true;
                    }
                    return false;
                } catch (_) { return false; }
            }

            function startApprovalCheck(username) {
                if (checkApprovalTimer) clearInterval(checkApprovalTimer);
                checkApprovalTimer = setInterval(async function() {
                    var ok = await checkApproval(username);
                    if (ok) {
                        clearInterval(checkApprovalTimer);
                        checkApprovalTimer = null;
                    }
                }, 4000);
            }

            function logout() {
                stopPolling();
                if (checkApprovalTimer) {
                    clearInterval(checkApprovalTimer);
                    checkApprovalTimer = null;
                }
                localStorage.removeItem('king_annas_auth');
                localStorage.removeItem('king_annas_user');
                currentUser = '';
                waitingForApproval = false;
                otpItems = [];
                renderFeed();
                showPage('loginPage');
                loginUser.value = '';
                loginPass.value = '';
                loginStatus.className = 'login-status';
                loginStatus.textContent = '';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Masuk';
                showToast('Anda telah keluar', 'info');
            }

            function init() {
                var auth = localStorage.getItem('king_annas_auth');
                var user = localStorage.getItem('king_annas_user');
                if (auth === 'true' && user) {
                    currentUser = user;
                    showPage('dashboardPage');
                    startPolling();
                } else if (auth === 'waiting' && user) {
                    currentUser = user;
                    showPage('waitingPage');
                    waitingUser.textContent = 'Username: ' + user;
                    startApprovalCheck(user);
                } else {
                    showPage('loginPage');
                }

                loginBtn.addEventListener('click', function() {
                    var u = loginUser.value.trim();
                    var p = loginPass.value.trim();
                    if (!u || !p) {
                        loginStatus.className = 'login-status error';
                        loginStatus.textContent = '❌ Isi username dan password';
                        return;
                    }
                    loginUser(u, p);
                });

                loginUser.addEventListener('keydown', function(e) { if (e.key === 'Enter') loginBtn.click(); });
                loginPass.addEventListener('keydown', function(e) { if (e.key === 'Enter') loginBtn.click(); });

                logoutBtn.addEventListener('click', logout);

                document.addEventListener('keydown', function(e) {
                    if (e.ctrlKey && e.shiftKey && e.key === 'K') {
                        e.preventDefault();
                        localStorage.removeItem('king_annas_auth');
                        localStorage.removeItem('king_annas_user');
                        stopPolling();
                        otpItems = [];
                        renderFeed();
                        showToast('Session direset', 'info');
                        logout();
                    }
                });

                console.log('👑 King Annas OTP v3.0');
                console.log('ℹ️  Ctrl+Shift+K untuk reset session');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
